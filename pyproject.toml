[project]
name = "talk-zep-integration"
version = "0.1.0"
description = "Recebe webhooks do Umbler Talk e alimenta a memoria do Zep (grafo por contato + grafo de conhecimento da Umbler)."
requires-python = ">=3.12"
dependencies = [
    "zep-cloud==3.28.0",
    "fastapi==0.141.1",
    "uvicorn[standard]==0.53.0",
    "pydantic-settings==2.15.0",
    "python-dotenv==1.2.3",
    "aiosqlite==0.22.1",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio", "ruff"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
